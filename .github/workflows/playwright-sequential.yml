name: Playwright Sequential Suite

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-sequential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app

      - name: Run all suites sequentially
        run: |
          npm run test:smoke -- --workers=1
          npm run test:ui -- --workers=1
          npm run test:api -- --workers=1
          npm run test:a11y -- --workers=1
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091

      - name: Upload JSONL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-logs-sequential
          path: playwright/logs/

      - name: Upload traces, screenshots, and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-sequential
          path: test-results/

name: Playwright Smoke Test

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app

      - name: Run smoke test
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091

      - name: Upload JSONL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-logs-smoke
          path: playwright/logs/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-smoke
          path: test-results/

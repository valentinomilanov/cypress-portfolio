name: Playwright Parallel Suites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright/logs/
            test-results/

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app
      - name: Run UI tests
        run: npm run test:ui
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-artifacts
          path: |
            playwright/logs/
            test-results/

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app
      - name: Run API tests
        run: npm run test:api
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-artifacts
          path: |
            playwright/logs/
            test-results/

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup app and Playwright
        uses: ./.github/actions/setup-app
      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-accessibility-artifacts
          path: |
            playwright/logs/
            test-results/
